- name: Request Builder
  scenarios:
    - name: Update headers after initial get
      input:
        url: "https://foobar.com/hello?name=world"
      assertions:
        - path: ( $.headers.get "authorization" )
          type: deepEqual
          expect: 
            scheme: foo
            token: "123"

- name: Request
  scenarios:

    - name: simple
      input:
        url: "https://foobar.com/hello?name=world"

      assertions:

        - path: $.url.toString()
          type: equal
          expect: "https://foobar.com/hello?name=world"

        - path: $.method
          type: equal
          expect: get

        - path: $.url.origin
          type: equal
          expect: "https://foobar.com"

        - path: $.url.domain
          type: equal
          expect: "foobar.com"

        - path: $.url.target
          type: equal
          expect: "/hello?name=world"

        - path: $.url.query
          type: deepEqual
          expect:
            name: world

    - name: with method
      input:
        url: "https://foobar.com/hello?name=world"
        method: "POST"

      assertions:

        - path: $.url.origin
          type: equal
          expect: "https://foobar.com"

        - path: $.url.target
          type: equal
          expect: "/hello?name=world"

        - path: $.method
          type: equal
          expect: post

    - name: with headers
      input:
        url: "https://foobar.com/hello?name=world"
        method: POST
        content: hello
        headers:
          Content-Type:
            type: text
            subtype: plain

      assertions:

        - path: ( $.headers.get 'content-type' ).data
          type: deepEqual
          expect:
            type: text
            subtype: plain

        # - path: $.headers.encoded.get 'content-type'
        #   type: deepEqual
        #   expect: text/plain

- name: Response
  scenarios:

    - name: status as text
      input:
        request:
          url: "https://foobar.com/hello?name=world"            
        status: "200"
      assertions:          
        - path: $.status
          type: equal
          expect: 200

    - name: status as number
      input:
        request:
          url: "https://foobar.com/hello?name=world"            
        status: 200
      assertions:          
        - path: $.status
          type: equal
          expect: 200

    - name: description only
      input:
        request:
          url: "https://foobar.com/hello?name=world"            
        description: ok
      assertions:          
        - path: $.status
          type: equal
          expect: 200

    - name: content only
      input:
        request:
          url: "https://foobar.com/hello?name=world"            
        content: hello
      assertions:          
        - path: $.status
          type: equal
          expect: 200

    - name: not found
      input:
        request:
          url: "https://foobar.com/hello?name=world"            
        description: "not found"
      assertions:          
        - path: $.status
          type: equal
          expect: 404

    - name: no content
      input:
        request:
          url: "https://foobar.com/hello?name=world"            
      assertions:          
        - path: $.status
          type: equal
          expect: 204

    - name: content as text
      input:
        request:
          url: "https://foobar.com/hello?name=world" 
          headers:
            accept:
              - type: text
                subtype: plain
        content: hello   
      assertions:          
        - path: $.status
          type: equal
          expect: 200
        - path: ( $.headers.get "content-type" ).data
          type: deepEqual
          expect:
            type: text
            subtype: plain
        - path: $.headers.get 'content-length'
          type: equal
          expect: 5
        - path: $.content
          type: equal
          expect: hello

    - name: content as object
      input:
        request:
          url: "https://foobar.com/hello?name=world" 
          headers:
            accept:
              - type: application
                subtype: json
        content:
          greeting: hello
      assertions:          
        - path: $.status
          type: equal
          expect: 200
        - path: $.headers.get 'content-length'
          type: equal
          expect: 20
        - path: $.content
          type: deepEqual
          expect:
            greeting: hello

    - name: unsupported media type
      input:
        request:
          url: "https://foobar.com/hello?name=world" 
          headers:
            accept:
              - type: application
                subtype: json
        content: this should fail
        headers:
          content-type: text/plain
      rejects: >-
        sublime: unacceptable response

- name: convert

  scenarios:

    - name: request

      scenarios:

        - name: basic

          input:
            url: "https://foobar.com/hello?name=world"

          assertions:

            - path: $.url.toString()
              type: equal
              expect: "https://foobar.com/hello?name=world"


    - name: response

      scenarios:

        - name: basic

          input:
            body: "hello"
            options:
              status: 200
              headers:
                "content-type": "text/plain"

          assertions:

            - path: $.status
              type: equal
              expect: 200
